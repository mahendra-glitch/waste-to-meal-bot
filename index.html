<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chef | Waste-to-Meal Bot</title>
    <style>
        /* Base Styles */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6; 
            color: #333; 
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* The main card: Responsive Width */
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: 1px solid #e0e0e0;
            width: 100%; /* Default for mobile */
            box-sizing: border-box;
            transition: width 0.3s ease;
        }

        /* Desktop view: Make it much wider */
        @media (min-width: 768px) {
            .card {
                max-width: 1000px; /* Wide but readable on Desktop */
                margin-top: 40px;
            }
        }

        /* Mobile view: Perfect fit */
        @media (max-width: 767px) {
            .card {
                padding: 20px;
                border-radius: 0; /* Full screen feel on phones */
                border: none;
            }
            body { padding: 0; }
        }

        h2 { text-align: center; color: #2e7d32; font-size: 2rem; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { text-align: center; font-size: 14px; margin-top: 0; color: #666; margin-bottom: 30px; }

        /* Input styling */
        .input-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        /* On wider screens, show inputs side-by-side */
        @media (min-width: 600px) {
            .input-group {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        input[type="text"] { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #2e7d32;
            outline: none;
        }

        button { 
            width: 100%; 
            padding: 16px; 
            margin: 25px 0; 
            background-color: #2e7d32; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold; 
            transition: transform 0.2s, background 0.3s; 
        }
        button:hover { background-color: #1b5e20; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background-color: #a5d6a7; cursor: not-allowed; }

        #recipeResult { background: #fff; border-radius: 8px; margin-top: 30px; }
        
        .quick-box { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 12px; 
            margin: 20px 0; 
            font-size: 16px; 
            font-weight: 600; 
            color: #2e7d32;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 8px;
        }

        /* Recipe Grid Layout for Variety */
        #recipeContent {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 900px) {
            #recipeContent {
                grid-template-columns: 1fr 1fr 1fr; /* Show 3 recipes side-by-side on wide screens */
            }
        }

        .recipe-option { 
            border: 1px solid #e0e0e0;
            padding: 20px; 
            border-radius: 12px;
            background: #fafafa;
            border-top: 5px solid #2e7d32;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ECO CHEF 👨‍🍳</h2>
        <p class="subtitle">Zero-Waste Kitchen Assistant | Powered by Claude AI</p>
        
        <div class="input-group">
            <input type="text" id="ing1" placeholder="Ingredient 1">
            <input type="text" id="ing2" placeholder="Ingredient 2">
            <input type="text" id="ing3" placeholder="Ingredient 3">
        </div>
        
        <div class="quick-box">
            <input type="checkbox" id="quickMode" style="transform: scale(1.5);">
            <label for="quickMode">Enable "Quick Mode" (15 mins or less)</label>
        </div>

        <button id="getBtn" onclick="generateRecipe()">Get Recipes</button>

        <div id="recipeResult">
            <div id="recipeContent"></div>
        </div>
    </div>

    <script>
        async function generateRecipe() {
            const i1 = document.getElementById('ing1').value;
            const i2 = document.getElementById('ing2').value;
            const i3 = document.getElementById('ing3').value;
            const isQuick = document.getElementById('quickMode').checked;
            
            const contentDiv = document.getElementById('recipeContent');
            const btn = document.getElementById('getBtn');

            if(!i1 || !i2 || !i3) {
                alert("Please enter all 3 ingredients!");
                return;
            }

            btn.innerText = "Chef is thinking...";
            btn.disabled = true;
            contentDiv.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'><i>Preparing 3 gourmet variations...</i></div>";

            try {
                const response = await fetch('/api/generate', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        ingredients: `${i1}, ${i2}, ${i3}`, 
                        isQuick: isQuick 
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                contentDiv.innerHTML = data.text;

            } catch (error) {
                contentDiv.innerHTML = `<div style='grid-column: 1/-1; color:red; text-align:center;'>Error: ${error.message}</div>`;
            } finally {
                btn.innerText = "Get Recipes";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
