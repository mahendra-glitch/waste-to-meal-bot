<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chef | Zero-Waste Recipes</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 20px; line-height: 1.6; color: #333; 
            background-color: #f4f7f6; display: flex; justify-content: center; min-height: 100vh;
        }

        .card { 
            background: white; padding: 40px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #e0e0e0;
            width: 100%; box-sizing: border-box;
        }

        @media (min-width: 768px) { .card { max-width: 1000px; margin-top: 40px; } }

        h2 { text-align: center; color: #2e7d32; font-size: 2.2rem; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 30px; }

        /* Ingredient List Grid */
        #ingredientContainer {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            #ingredientContainer { grid-template-columns: 1fr 1fr; } /* 2 columns on tablet */
        }
        @media (min-width: 900px) {
            #ingredientContainer { grid-template-columns: 1fr 1fr 1fr; } /* 3 columns on desktop */
        }

        input[type="text"] { 
            width: 100%; padding: 12px; border: 2px solid #eee; 
            border-radius: 8px; box-sizing: border-box; font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #2e7d32; outline: none; }

        /* Buttons Styling */
        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        
        .add-btn {
            background-color: #f1f1f1; color: #444; border: 1px solid #ddd;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .add-btn:hover { background-color: #e2e2e2; }

        .generate-btn { 
            flex-grow: 1; padding: 16px; background-color: #2e7d32; 
            color: white; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 18px; font-weight: bold; transition: 0.3s; 
        }
        .generate-btn:hover { background-color: #1b5e20; }
        .generate-btn:disabled { background-color: #a5d6a7; }

        .quick-box { 
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin: 20px 0; font-size: 16px; font-weight: 600; 
            color: #2e7d32; background: #e8f5e9; padding: 12px; border-radius: 8px;
        }

        #recipeContent {
            display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px;
        }
        @media (min-width: 900px) { #recipeContent { grid-template-columns: 1fr 1fr 1fr; } }

        .recipe-option { 
            border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px;
            background: #fafafa; border-top: 5px solid #2e7d32;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ECO CHEF 👨‍🍳</h2>
        <p class="subtitle">List your ingredients. Click (+) to add more items!</p>
        
        <div id="ingredientContainer">
            <input type="text" class="ing-input" placeholder="Ingredient 1">
            <input type="text" class="ing-input" placeholder="Ingredient 2">
            <input type="text" class="ing-input" placeholder="Ingredient 3">
        </div>
        
        <div class="button-group">
            <button class="add-btn" onclick="addInput()">+ Add More</button>
        </div>

        <div class="quick-box">
            <input type="checkbox" id="quickMode" style="transform: scale(1.4);">
            <label for="quickMode">Enable "Quick Mode" (15 mins or less)</label>
        </div>

        <button id="getBtn" class="generate-btn" onclick="generateRecipe()">Get Recipes</button>

        <div id="recipeResult">
            <div id="recipeContent"></div>
        </div>
    </div>

    <script>
        // Function to add new input boxes
        function addInput() {
            const container = document.getElementById('ingredientContainer');
            const inputCount = container.getElementsByTagName('input').length + 1;
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'ing-input';
            newInput.placeholder = `Ingredient ${inputCount}`;
            container.appendChild(newInput);
        }

        async function generateRecipe() {
            const inputs = document.querySelectorAll('.ing-input');
            const ingredientArray = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== "");
            const isQuick = document.getElementById('quickMode').checked;
            
            if(ingredientArray.length < 1) {
                alert("Please enter at least one ingredient!");
                return;
            }

            const btn = document.getElementById('getBtn');
            const contentDiv = document.getElementById('recipeContent');

            btn.innerText = "Chef is analyzing...";
            btn.disabled = true;
            contentDiv.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'><i>Crafting 3 zero-waste suggestions...</i></div>";

            try {
                const response = await fetch('/api/generate', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        ingredients: ingredientArray.join(", "), 
                        isQuick: isQuick 
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);
                contentDiv.innerHTML = data.text;

            } catch (error) {
                contentDiv.innerHTML = `<div style='grid-column: 1/-1; color:red; text-align:center;'>Error: ${error.message}</div>`;
            } finally {
                btn.innerText = "Get Recipes";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
