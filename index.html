<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chef | Zero-Waste Assistant</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg); display: flex; justify-content: center; }
        
        .card { 
            background: white; padding: 40px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; 
            max-width: 1100px; box-sizing: border-box; margin-top: 20px;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 25px; }

        #ingredientContainer { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 12px; margin-bottom: 15px; 
        }

        input[type="text"] { 
            width: 100%; padding: 12px; border: 2px solid #eee; 
            border-radius: 8px; box-sizing: border-box; font-size: 15px;
        }

        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-btn { background: #f1f1f1; border: 1px solid #ddd; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .generate-btn { flex-grow: 1; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }

        .quick-box { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            margin: 20px 0; background: #e8f5e9; padding: 12px; border-radius: 8px; 
            color: var(--primary); font-weight: bold; 
        }

        /* THE GRID FIX */
        #recipeContent { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-top: 30px; 
            align-items: stretch;
        }

        @media (min-width: 850px) {
            #recipeContent { grid-template-columns: 1fr 1fr 1fr; }
        }

        .recipe-option { 
            border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; 
            background: #fafafa; border-top: 6px solid var(--primary);
            display: flex; flex-direction: column;
        }

        .recipe-option h3 { color: var(--primary); margin-top: 0; font-size: 1.2rem; min-height: 3em; }
        .recipe-option ul, .recipe-option ol { padding-left: 20px; font-size: 0.95rem; flex-grow: 1; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ECO CHEF 👨‍🍳</h2>
        <p class="subtitle">Enter ingredients and get 3 zero-waste variations.</p>
        
        <div id="ingredientContainer">
            <input type="text" class="ing-input" placeholder="Ingredient 1">
            <input type="text" class="ing-input" placeholder="Ingredient 2">
            <input type="text" class="ing-input" placeholder="Ingredient 3">
        </div>
        
        <div class="button-group">
            <button class="add-btn" onclick="addInput()">+ Add More</button>
        </div>

        <div class="quick-box">
            <input type="checkbox" id="quickMode" style="transform: scale(1.3);">
            <label for="quickMode">Enable "Quick Mode" (15 mins or less)</label>
        </div>

        <button id="getBtn" class="generate-btn" onclick="generateRecipe()">Get Recipes</button>

        <div id="recipeResult">
            <div id="recipeContent"></div>
        </div>
    </div>

    <script>
        function addInput() {
            const container = document.getElementById('ingredientContainer');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'ing-input';
            input.placeholder = `Ingredient ${container.children.length + 1}`;
            container.appendChild(input);
        }

        async function generateRecipe() {
            const inputs = document.querySelectorAll('.ing-input');
            const ingredientList = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== "").join(", ");
            const isQuick = document.getElementById('quickMode').checked;
            
            if(!ingredientList) return alert("Please enter ingredients!");

            const btn = document.getElementById('getBtn');
            const contentDiv = document.getElementById('recipeContent');

            btn.innerText = "Chef is thinking...";
            btn.disabled = true;
            contentDiv.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'><i>Preparing 3 unique suggestions...</i></div>";

            try {
                const response = await fetch('/api/generate', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ingredients: ingredientList, isQuick: isQuick })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                // This directly injects the 3 divs from the AI into our grid
                contentDiv.innerHTML = data.text;

            } catch (error) {
                contentDiv.innerHTML = `<div style='grid-column: 1/-1; color:red; text-align:center;'>Error: ${error.message}</div>`;
            } finally {
                btn.innerText = "Get Recipes";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
