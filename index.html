<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chef | Zero-Waste Assistant</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg); display: flex; justify-content: center; }
        
        .card { 
            background: white; padding: 40px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; 
            max-width: 1100px; box-sizing: border-box; margin-top: 20px;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 5px; font-size: 2.2rem; }
        .subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 25px; }

        /* JUSTIFIED ROW: 3 per row on Desktop */
        #ingredientContainer { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Forces 3 per row */
            gap: 15px; 
            margin-bottom: 15px; 
        }

        /* Mobile fallback: Stack them on very small screens */
        @media (max-width: 600px) {
            #ingredientContainer { grid-template-columns: 1fr; }
        }

        input[type="text"] { 
            width: 100%; padding: 14px; border: 2px solid #eee; 
            border-radius: 8px; box-sizing: border-box; font-size: 15px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); outline: none; }

        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-btn { background: #fff; border: 1px solid #ddd; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .add-btn:hover { background: #f9f9f9; }

        .generate-btn { 
            flex-grow: 1; padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; 
            font-size: 18px; transition: 0.3s; 
        }
        .generate-btn:hover { background: #1b5e20; }

        .quick-box { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            margin: 20px 0; background: #e8f5e9; padding: 14px; border-radius: 8px; 
            color: var(--primary); font-weight: bold; 
        }

        #recipeContent { 
            display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 30px; align-items: stretch;
        }

        @media (min-width: 850px) {
            #recipeContent { grid-template-columns: 1fr 1fr 1fr; }
        }
