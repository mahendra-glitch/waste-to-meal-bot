<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chef | Zero-Waste Recipes</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; resize: none; font-size: 16px; }
        .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        button { background-color: #2e7d32; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #1b5e20; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #output { margin-top: 30px; }
        /* Style for the 3 suggested recipes */
        .recipe-option { background: #fff; border-left: 5px solid #2e7d32; padding: 15px; margin-bottom: 25px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .recipe-option h3 { margin-top: 0; color: #2e7d32; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
        .loading { text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌿 Eco Chef</h1>
    <p>Enter your leftover ingredients and I'll suggest 3 ways to use them!</p>
    
    <textarea id="ingredients" placeholder="e.g. 2 eggs, stale bread, half an onion..."></textarea>
    
    <div class="controls">
        <input type="checkbox" id="quickMode">
        <label for="quickMode"><strong>Quick Mode</strong> (Under 15 mins)</label>
    </div>

    <button id="getRecipeBtn">Generate Recipes</button>

    <div id="output"></div>
</div>

<script>
    const btn = document.getElementById('getRecipeBtn');
    const output = document.getElementById('output');

    btn.addEventListener('click', async () => {
        const ingredients = document.getElementById('ingredients').value;
        const isQuick = document.getElementById('quickMode').checked;

        if (!ingredients) {
            alert("Please enter some ingredients!");
            return;
        }

        // UI Updates
        btn.disabled = true;
        btn.innerText = "Chef is thinking...";
        output.innerHTML = '<p class="loading">Analyzing ingredients and creating 3 variations...</p>';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ingredients, isQuick })
            });

            const data = await response.json();

            if (data.error) {
                output.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
            } else {
                // The AI returns HTML strings wrapped in .recipe-option divs
                output.innerHTML = data.text;
            }
        } catch (err) {
            output.innerHTML = '<p style="color:red;">Server connection failed. Try again!</p>';
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate Recipes";
        }
    });
</script>

</body>
</html>
